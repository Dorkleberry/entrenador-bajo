<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="fretWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d1c16" />
      <stop offset="50%" stop-color="#452a21" />
      <stop offset="100%" stop-color="#2d1c16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />

  <!-- Bass Neck Preview -->
  <rect x="76" y="160" width="360" height="200" rx="16" fill="url(#fretWood)" stroke="#64748b" stroke-width="4" />

  <!-- Frets -->
  <line x1="166" y1="160" x2="166" y2="360" stroke="#cbd5e1" stroke-width="6" />
  <line x1="256" y1="160" x2="256" y2="360" stroke="#cbd5e1" stroke-width="6" />
  <line x1="346" y1="160" x2="346" y2="360" stroke="#cbd5e1" stroke-width="6" />

  <!-- Inlay Dot -->
  <circle cx="256" cy="260" r="14" fill="#f8fafc" opacity="0.9" />

  <!-- 4 Bass Strings (Thick to thin) -->
  <line x1="76" y1="320" x2="436" y2="320" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round" />
  <line x1="76" y1="280" x2="436" y2="280" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round" />
  <line x1="76" y1="240" x2="436" y2="240" stroke="#94a3b8" stroke-width="6.5" stroke-linecap="round" />
  <line x1="76" y1="200" x2="436" y2="200" stroke="#64748b" stroke-width="4.5" stroke-linecap="round" />

  <!-- Glowing Note Badge -->
  <circle cx="256" cy="320" r="26" fill="#3b82f6" stroke="#ffffff" stroke-width="4" />
  <text x="256" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>

  <!-- Clef / Accent -->
  <path d="M120 120 Q140 80 180 80 T220 120" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <text x="256" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#60a5fa" text-anchor="middle" letter-spacing="2">BASS TRAINER</text>
</svg>
